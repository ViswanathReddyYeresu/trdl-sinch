name: trdl-ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: trdl-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_CI_ROLE_ARN: ${{ vars.AWS_CI_ROLE_ARN }}
  CLUSTER_NAME: trdl-poc

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build image
        run: docker build -t trdl:${{ github.sha }} .
      - id: push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/trdl:${{ github.sha }}"
          docker tag "trdl:${{ github.sha }}" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: poc
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Connect kubectl
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
      - name: Deploy
        run: |
          sed -i "s|image: PLACEHOLDER_IMAGE|image: ${{ needs.build.outputs.image }}|" k8s/trdl.yaml
          kubectl apply -f k8s/trdl.yaml
          kubectl rollout status deployment/trdl --timeout=180s
      - name: Smoke test through the load balancer
        run: |
          HOST=""
          for _ in $(seq 1 20); do
            HOST=$(kubectl get ingress trdl -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true)
            [ -n "$HOST" ] && break
            sleep 15
          done
          for _ in $(seq 1 20); do
            BODY=$(curl -fsS "http://$HOST/" || true)
            if [ "$BODY" = "42" ]; then echo "Smoke test passed"; exit 0; fi
            sleep 15
          done
          echo "Smoke test failed"; exit 1
      - name: Roll back on failure
        if: failure()
        run: kubectl rollout undo deployment/trdl
